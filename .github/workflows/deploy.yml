name: Deploy to CyberPanel VPS (Sub4)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # Sesuaikan jika pakai PHP 8.1 atau 8.3

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install NPM & Build Assets
        run: |
          npm install
          npm run build

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY_VPS2 }}

      - name: Add Server to Known Hosts
        run: ssh-keyscan -H 72.61.142.238 >> ~/.ssh/known_hosts

      - name: Deploy files with rsync
        run: |
          # Mengirim semua file langsung ke folder laravel-sub4
          rsync -avz --exclude='.git' --exclude='.github' --exclude='.env' ./ root@72.61.142.238:/home/pbmagency.id/laravel-sub4/

      - name: Fix Permissions & Clear Cache
        run: |
          ssh root@72.61.142.238 << 'EOF'
            # 1. Cari tahu siapa user/karyawan CyberPanel asli di server ini
            CYBER_USER=$(stat -c '%U' /home/pbmagency.id/public_html)
            CYBER_GROUP=$(stat -c '%G' /home/pbmagency.id/public_html)
            
            # 2. Copot gembok root! Ubah kepemilikan menjadi milik CyberPanel
            chown -R $CYBER_USER:$CYBER_GROUP /home/pbmagency.id/laravel-sub4
            
            # 3. Beri izin jalan untuk folder cache & storage Laravel
            chmod -R 775 /home/pbmagency.id/laravel-sub4/storage
            chmod -R 775 /home/pbmagency.id/laravel-sub4/bootstrap/cache

            # 4. Pembersihan Cache (Sesuai Guidebook)
            # Diberi tanda '#' sementara agar tidak error saat deploy tanpa file .env
            # cd /home/pbmagency.id/laravel-sub4
            # php artisan optimize:clear
          EOF