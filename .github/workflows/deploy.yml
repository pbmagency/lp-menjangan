name: Deploy to CyberPanel VPS (Sub1)

on:
  push:
    branches:
      - main # (Bisa lu ganti kalau branch buat sub1 beda)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # Tetap pakai PHP 8.3

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install NPM & Build Assets
        run: |
          npm install
          npm run build

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY_VPS2 }}

      - name: Add Server to Known Hosts
        run: ssh-keyscan -H 72.61.142.238 >> ~/.ssh/known_hosts

      - name: Deploy files with rsync
        run: |
          # Mengirim semua file ke folder laravel-sub1
          rsync -avz --exclude='.git' --exclude='.github' --exclude='.env' ./ root@72.61.142.238:/home/pbmagency.id/laravel-sub1/

      - name: Fix Permissions
        run: |
          ssh root@72.61.142.238 << 'EOF'
            CYBER_USER=$(stat -c '%U' /home/pbmagency.id/public_html)
            CYBER_GROUP=$(stat -c '%G' /home/pbmagency.id/public_html)
            
            # Ubah kepemilikan dan izin folder untuk Sub1
            chown -R $CYBER_USER:$CYBER_GROUP /home/pbmagency.id/laravel-sub1
            chmod -R 775 /home/pbmagency.id/laravel-sub1/storage
            chmod -R 775 /home/pbmagency.id/laravel-sub1/bootstrap/cache
          EOF