name: Deploy to CyberPanel VPS (Sub1)

on:
  push:
    branches:
      - main # Pastikan ini nama branch lu yang bener

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # Menggunakan PHP 8.3 sesuai server

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install NPM & Build Assets
        run: |
          npm install
          npm run build

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY_VPS2 }}

      - name: Add Server to Known Hosts
        run: ssh-keyscan -H 72.61.142.238 >> ~/.ssh/known_hosts

      - name: Deploy files with rsync
        run: |
          # Mengirim file ke Sub1, mengabaikan .git, .github, dan .env
          rsync -avz --exclude='.git' --exclude='.github' --exclude='.env' ./ root@72.61.142.238:/home/pbmagency.id/laravel-sub1/

      - name: Execute Server Commands & Fix Permissions
        run: |
          ssh root@72.61.142.238 << 'EOF'
            cd /home/pbmagency.id/laravel-sub1
            
            # 1. Bikin Symlink Storage (Biar gambar ke-load)
            php artisan storage:link --force
            
            # 2. Publish Aset Bagisto (Biar CSS/JS bawaan Bagisto aman)
            php artisan bagisto:publish --force
            
            # 3. Bersihkan semua memori ingatan (Cache) Laravel
            php artisan view:clear
            php artisan cache:clear
            php artisan config:clear
            php artisan optimize:clear
            
            # 4. Benerin kepemilikan dan izin akses file server
            CYBER_USER=$(stat -c '%U' /home/pbmagency.id/public_html)
            CYBER_GROUP=$(stat -c '%G' /home/pbmagency.id/public_html)
            chown -R $CYBER_USER:$CYBER_GROUP /home/pbmagency.id/laravel-sub1
            chmod -R 775 /home/pbmagency.id/laravel-sub1/storage
            chmod -R 775 /home/pbmagency.id/laravel-sub1/bootstrap/cache
          EOF