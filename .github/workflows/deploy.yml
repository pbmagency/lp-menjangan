name: Deploy to Production (LP Menjangan)

on:
  push:
    branches:
      - main # Pastikan ini nama branch lu

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # Sesuai versi PHP di server

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install NPM & Build Assets
        run: |
          npm install
          npm run build

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY_VPS2 }}

      - name: Disable Strict Host Key Checking
        run: |
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Deploy files with rsync
        run: |
          # Mengirim file ke folder web production, mengabaikan .git, .github, dan .env
          rsync -avz --exclude='.git' --exclude='.github' --exclude='.env' ./ root@72.61.142.238:/home/lp.menjanganislandtrip.com/public_html/

      - name: Execute Server Commands & Fix Permissions
        run: |
          ssh root@72.61.142.238 << 'EOF'
            cd /home/lp.menjanganislandtrip.com/public_html
            
            # 1. Bikin tabel dan isi data awal (Seeder)
            php artisan migrate --force
            php artisan db:seed --force
            
            # 2. Bikin Symlink Storage & Publish Aset Bagisto
            php artisan storage:link --force
            php artisan bagisto:publish --force
            
            # 3. Rebuild semua cache Laravel
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            
            # 4. Benerin kepemilikan dan izin akses file server
            CYBER_USER=$(stat -c '%U' /home/lp.menjanganislandtrip.com/public_html)
            CYBER_GROUP=$(stat -c '%G' /home/lp.menjanganislandtrip.com/public_html)
            chown -R $CYBER_USER:$CYBER_GROUP /home/lp.menjanganislandtrip.com/public_html
            chmod -R 775 /home/lp.menjanganislandtrip.com/public_html/storage
            chmod -R 775 /home/lp.menjanganislandtrip.com/public_html/bootstrap/cache
          EOF